name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publication_id:
        description: 'Identyfikator zestawu CMS (puste pole: przebuduj obecną publikację)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test validation, uploads and service API
        run: npm test
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Check backend TypeScript
        run: npm run api:check
      - name: Build isolated admin assets
        run: npm run cf:panel:build
      - name: Check Cloudflare binding types
        run: npm run cf:types -- --check
      - name: Check Cloudflare TypeScript
        run: npm run cf:check
      - name: Test D1 migrations and data constraints
        run: npm run cf:db:test
      - name: Test Workers service API and address integration
        run: npm run cf:api:test
      - name: Test private R2 uploads and cost safeguards
        run: npm run cf:files:test
      - name: Test contact API and private dashboard data
        run: npm run cf:contact:test
      - name: Test CMS drafts, approvals and private images
        run: npm run cf:cms:test
      - name: Test editable page texts and approved revisions
        run: npm run cf:texts:test
      - name: Test approved publication and GitHub OIDC
        run: npm run cf:publication:test
      - name: Test static CMS publication
        run: npm run publication:test
      - name: Test administrator API and concurrency
        run: npm run cf:admin:test
      - name: Test Cloudflare Access token verification
        run: npm run cf:access:test
      - name: Test local Cloudflare bindings
        run: npm run cf:smoke
      - name: Validate Cloudflare deployments without uploading
        run: |
          npm run cf:dry-run:staging
          npm run cf:dry-run:production
      - name: Fetch immutable approved CMS publication
        run: node scripts/publication-fetch.mjs
        env:
          PUBLICATION_API_URL: ${{ vars.SERVICE_API_URL }}
          PUBLICATION_ID: ${{ inputs.publication_id || '' }}
      - name: Build for GitHub Pages
        run: npm run build
        env:
          CMS_PUBLICATION_FILE: .publication/site.json
          GITHUB_PAGES: 'true'
          PUBLIC_SERVICE_API_URL: ${{ vars.SERVICE_API_URL }}
          PUBLIC_TURNSTILE_SITEKEY: ${{ vars.TURNSTILE_SITEKEY }}
      - name: Test built CMS routes and media
        run: node scripts/publication-check.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    timeout-minutes: 15
    # Enable only after Pages is available for this repository's visibility/plan.
    if: vars.PAGES_ENABLED == 'true'
    needs: [build, service-e2e, backend-container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Acknowledge CMS publication
        if: always() && inputs.publication_id != ''
        run: node scripts/publication-notify.mjs
        env:
          PUBLICATION_API_URL: ${{ vars.SERVICE_API_URL }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
          PUBLICATION_RESULT: ${{ steps.deployment.outcome }}

  service-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          PUBLIC_SERVICE_API_URL: http://127.0.0.1:8790
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: service-e2e-failures
          path: test-results

  backend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate backend deployment image
        run: docker build -t rpv-api-test .

  publication-failed:
    if: always() && inputs.publication_id != '' && (needs.build.result != 'success' || needs.service-e2e.result != 'success' || needs.backend-container.result != 'success')
    needs: [build, service-e2e, backend-container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/publication-notify.mjs
        env:
          PUBLICATION_API_URL: ${{ vars.SERVICE_API_URL }}
          PUBLICATION_ID: ${{ inputs.publication_id }}
          PUBLICATION_RESULT: failure
